name: tests

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: "8.4"
                  tools: composer:v2
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Setup Application
              run: composer setup

            - name: Run CI Checks
              run: composer ci:check

            - name: Prepare application for E2E
              run: |
                  cp .env.example .env
                  php artisan key:generate
                  touch database/database.sqlite
                  php artisan migrate --force
                  php artisan db:seed-kiventro-demo --with-history

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run E2E tests
              run: npm run test:e2e

            - name: Validate production compose configuration
              run: docker compose -f compose.prod.yaml config --quiet

    docker-build:
        runs-on: ubuntu-latest
        # Bild-Build nur bei Push auf main (Entscheidung 3) – PRs prüfen nur Tests+Compose.
        if: github.event_name == 'push'
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build production image (Dockerfile.prod)
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: Dockerfile.prod
                  push: false
                  tags: b2e-template/app:ci
                  cache-from: type=gha,scope=${{ github.workflow }}
                  cache-to: type=gha,mode=max,scope=${{ github.workflow }}
